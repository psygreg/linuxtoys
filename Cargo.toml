[package]
name = "linuxtoys-catalog"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[lib]
name = "_catalog_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.24", features = ["abi3-py310", "extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1.3"
serde_bytes = "0.11"
walkdir = "2"
unicode-normalization = "0.1"
url = "2"
quick-xml = "0.38"
flate2 = "1"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std"] }
