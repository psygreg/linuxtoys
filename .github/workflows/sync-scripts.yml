name: Prepare script review artifact

# Manual preparation only. No push, schedule, repository_dispatch or chained run.
"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the selected client commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Test and prepare the already approved revision
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s dev/tests -p test_script_preparation.py -v
          python3 dev/prepare_script_rollout.py --check --artifact-dir "$RUNNER_TEMP/script-preparation"

      # Review storage only: no release asset, Git commit, tag, mirror or publisher.
      # The required dotfile is inside scripts.tar, not subject to upload filtering.
      - name: Retain the archive and validation report for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: script-review-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/script-preparation/
          if-no-files-found: error
          overwrite: false
          retention-days: 7
