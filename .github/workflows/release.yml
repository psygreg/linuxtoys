# Release pipeline for LinuxToys.
#
# Replicates the packaged release run of ./build-rust.sh release on GitHub
# runners, producing every release artifact the local flow produced:
#
#   prepare    - resolves the release version, generates the release notes
#                (commit subjects since the last tag, one per line) and
#                vendors the TUI dependencies into p3/vendor (vendored into
#                every package).
#   deb-ppa    - dev/build/deb/build.sh      -> linuxtoys_<v>-1_<arch>.deb for
#                amd64 and arm64, plus ONE signed source upload to the
#                Launchpad PPA through dput from the amd64 leg (skipped when
#                the required secrets are absent); the arm64 leg runs
#                build.sh --binary-only and never touches the PPA.
#   rpm        - dev/build/copr/build.sh     -> .rpm for x86_64 and aarch64
#                (the .src.rpm is built once, on the x86_64 leg, and is fed
#                into COPR by hand, as before).
#   arch-pkg   - dev/build/pkg/build.sh      -> linuxtoys-<v>.tar.xz (AUR
#                release source), an updated PKGBUILD with the tarball hash,
#                and linuxtoys-<v>-1-<arch>.pkg.tar.zst for x86_64 and
#                aarch64. AUR push stays manual.
#   appimage   - dev/build/appimage/build.sh -> LinuxToys-<v>-<arch>.AppImage
#                for x86_64 and aarch64.
#   release    - creates the git tag (plain version, e.g. "7.9"), a GitHub
#                release with the notes file and a sha256sums.txt asset.
#
# Notes and divergences from the local flow:
#   * Every packaging job runs twice through a native-architecture matrix:
#     the historical leg on an x86_64 runner and a second leg on an arm64
#     runner (ubuntu-24.04-arm, free for public repositories). Both legs
#     build natively - no QEMU emulation, no cross toolchains - inside the
#     same distro container images, which resolve to the matching
#     architecture variant on the arm64 runners. Artifacts carry the
#     packaging architecture in their names (amd64/arm64 for .deb,
#     x86_64/aarch64 elsewhere), and each leg uploads its own
#     release-assets-<job>-<arch> artifact so the release job merges them
#     without collisions. The x86_64 rpm leg is the only one collecting the
#     .src.rpm, and the x86_64 arch leg is the only one collecting the AUR
#     tarball + PKGBUILD: those are architecture-independent inputs, and a
#     second copy under the same name would collide in dist/.
#   * The PPA receives its source upload exactly once, from the amd64 deb
#     leg; Launchpad then builds binaries for the architectures enabled on
#     the PPA (adding arm64 there is a PPA-side setting, independent of this
#     workflow). debian/control therefore declares Architecture: any.
#   * The worker containers stand in for the distrobox containers: Fedora and
#     Arch jobs run inside their official container images, the DEB job runs
#     on the Ubuntu runner (noble, matching the debian/changelog target).
#   * Arch's official images (Docker Hub / ghcr.io / quay.io) publish
#     linux/amd64 only, so the aarch64 Arch legs cannot pull them on the
#     ubuntu-24.04-arm runners ("no matching manifest for linux/arm64/v8").
#     The ci-image job instead builds a LinuxToys image from the
#     signature-verified Arch Linux ARM aarch64 rootfs
#     (.github/ci-images/archlinux-aarch64/Dockerfile), pushes it to GHCR and
#     hands the aarch64 arch-pkg/appimage legs a digest-pinned reference; the
#     x86_64 legs keep the official archlinux:base-devel. ALARM signs the
#     rootfs with a detached signature, so the ci-image job pins ALARM's
#     published signing-key fingerprints (fetched by fingerprint from
#     keyserver.ubuntu.com over TLS) and refuses the build when the signature
#     does not verify against one of them.
#   * Before every packaging job, the Rust bits are built and deployed into
#     p3/app exactly like the "develop" pass that ./build-rust.sh release
#     performs before staging (sharun and distro builds rely on the shared
#     target/ directories, so this is not wasted work).
#   * GITHUB_REPOSITORY is emptied for the AppImage build: quick-sharun would
#     otherwise embed a gh-releases-zsync update hint that local builds never
#     embed (LinuxToys ships its own updater). Remove that env override to
#     turn the embedded update information on.
#   * Solus stays out of this pipeline, same as ./build-rust.sh release.
#   * The PPA can only receive a given "<version>-1" source once; re-running
#     the workflow for an already-uploaded version and re-using a version
#     with an existing git tag are both rejected early.
#   * Test runs (inputs.test) rebuild the last tag against the current
#     source: the version must already exist as a git tag, no GitHub release
#     is created, and the PPA upload is probed only against versions
#     Launchpad already holds (a duplicate re-upload gets rejected
#     asynchronously; a probe on an unknown version would be published live
#     and is skipped instead). Artifacts stay uploaded to the run page for
#     inspection.
#   * Push trigger: a push to master that touches src/ver IS the release
#     signal - the pipeline runs in full release mode against the committed
#     version string with both the PPA upload and the GitHub release armed.
#     If the pushed version is already tagged the run no-ops gracefully
#     (green, packaging jobs skipped) instead of failing.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (falls back to src/ver when empty; must be an existing tag in test mode)'
        required: false
        default: ''
      upload_ppa:
        description: 'Upload the signed source package to the Launchpad PPA'
        type: boolean
        required: false
        default: true
      test:
        description: 'Test run: rebuild the last tag, no GitHub release (PPA is expected to reject the upload)'
        type: boolean
        required: false
        default: false
  # Bumping src/ver on the release branch IS the release signal: a push that
  # touches it runs the full pipeline against the committed version string
  # with the PPA upload and the GitHub release armed (dispatch inputs do not
  # exist for push events). A src/ver push that re-lands an already-tagged
  # version no-ops gracefully instead of failing the run.
  push:
    branches:
      - master
    paths:
      - src/ver

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  # pip on Ubuntu/Fedora refuses --target installs when it finds the PEP 668
  # EXTERNALLY-MANAGED marker. This env acts like --break-system-packages and
  # keeps dev/build/vendor_deps.sh usable in those environments; it is a
  # no-op for interpreters without the marker (Arch, venvs).
  PIP_BREAK_SYSTEM_PACKAGES: "1"

jobs:
  prepare:
    name: Version, release notes and vendored TUI deps
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      test_mode: ${{ steps.version.outputs.test_mode }}
      upload_ppa: ${{ steps.version.outputs.upload_ppa }}
      proceed: ${{ steps.version.outputs.proceed }}
    steps:
      - name: Check out repository (full history for the release notes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate the release version
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
          TEST_MODE: ${{ inputs.test }}
          UPLOAD_PPA_INPUT: ${{ inputs.upload_ppa }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Push trigger (src/ver bumped on the branch): full release mode
          # against the committed version string. Dispatch: explicit toggles,
          # with empty API omissions defaulting to enabled.
          if [ "$EVENT_NAME" = "push" ]; then
              echo "test_mode=false" >> "$GITHUB_OUTPUT"
              echo "upload_ppa=true" >> "$GITHUB_OUTPUT"
              version="$(tr -d ' \t\r\n' < src/ver)"
          else
              version="$VERSION_INPUT"
              if [ "$TEST_MODE" == "true" ]; then
                  echo "test_mode=true" >> "$GITHUB_OUTPUT"
                  # A test run re-feeds an already released version against the
                  # current source: default to the last tag on the checkout.
                  if [ -z "$version" ]; then
                      version="$(git describe --tags --abbrev=0 2>/dev/null || true)"
                  fi
                  if [ -z "$version" ]; then
                      echo "::error::No tags exist in this repository - test mode needs at least one release tag to re-feed." >&2
                      exit 1
                  fi
                  echo "upload_ppa=true" >> "$GITHUB_OUTPUT"
              else
                  echo "test_mode=false" >> "$GITHUB_OUTPUT"
                  if [ -z "$version" ]; then
                      version="$(tr -d ' \t\r\n' < src/ver)"
                  fi
                  if [ -z "$UPLOAD_PPA_INPUT" ]; then
                      UPLOAD_PPA_INPUT=true
                  fi
                  echo "upload_ppa=$UPLOAD_PPA_INPUT" >> "$GITHUB_OUTPUT"
              fi
          fi
          # RPM does not accept dashes, keep the whole pipeline consistent.
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
              echo "::error::Version '$version' is not valid; use plain dotted numbers (e.g. 7.9)." >&2
              exit 1
          fi
          if [ "$TEST_MODE" == "true" ]; then
              if ! git rev-parse -q --verify "refs/tags/$version" >/dev/null 2>&1; then
                  echo "::error::Test mode rebuilds an existing release - '$version' has no git tag. This guard also keeps a test from uploading a never-released version to the PPA." >&2
                  exit 1
              fi
              echo "::notice::Test run: rebuilding '$version' against the current source. No GitHub release is created and the PPA upload is expected to be rejected by Launchpad."
              echo "proceed=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "push" ]; then
              if git rev-parse -q --verify "refs/tags/$version" >/dev/null 2>&1; then
                  echo "::notice::Pushed src/ver holds '$version', which is already released - nothing to do, skipping the run."
                  echo "proceed=false" >> "$GITHUB_OUTPUT"
                  exit 0
              fi
              echo "::notice::src/ver bump detected: releasing '$version' with the PPA upload and a GitHub release."
              echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
              if git rev-parse -q --verify "refs/tags/$version" >/dev/null 2>&1; then
                  echo "::error::A git tag for '$version' already exists. Bump the version and try again." >&2
                  exit 1
              fi
              echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Generate release notes (non-merge subjects since the last tag)
        if: inputs.test != true && steps.version.outputs.proceed != 'false'
        run: |
          prev_tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "$prev_tag" ]; then
              git log --no-merges --skip=1 --format='- %s' "$prev_tag..$GITHUB_SHA" > release-notes.txt
          else
              git log --no-merges --skip=1 --format='- %s' > release-notes.txt
          fi
          if [ ! -s release-notes.txt ]; then
              echo "No commits since tag ${prev_tag:-origin}." > release-notes.txt
          fi

      - name: Vendor the TUI dependencies for packaging
        if: steps.version.outputs.proceed != 'false'
        run: |
          if ! python3 -m pip --version >/dev/null 2>&1; then
              sudo apt-get update -qq
              sudo apt-get install -y -qq python3-pip
          fi
          bash dev/build/vendor_deps.sh

      - name: Upload vendored TUI dependencies
        if: steps.version.outputs.proceed != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: tui-vendor
          path: p3/vendor
          if-no-files-found: error

      - name: Upload release notes
        if: inputs.test != true && steps.version.outputs.proceed != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.txt
          if-no-files-found: error

  ci-image:
    name: Build the aarch64 Arch CI image (ALARM rootfs)
    # The official Arch images are linux/amd64-only, so the aarch64 Arch legs
    # need an Arch Linux ARM (ALARM) based image. This job builds it fresh on
    # every run and pins it by digest: the packaging legs then run exactly the
    # bits this job built and verified, with no third-party container trust.
    runs-on: ubuntu-24.04-arm
    needs: prepare
    if: needs.prepare.outputs.proceed == 'true'
    timeout-minutes: 45
    outputs:
      image: ${{ steps.image.outputs.image }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch and verify the Arch Linux ARM rootfs
        # ALARM publishes the rootfs over plain http (its os.* TLS endpoint
        # serves a mismatched certificate), so authenticity comes from the
        # detached signature: fetch it alongside the tarball and require it to
        # verify against a key matching one of ALARM's published signing-key
        # fingerprints. The keys themselves are fetched by fingerprint from
        # keyserver.ubuntu.com over TLS (https://archlinuxarm.org/about/
        # package-signing), so only the pinned fingerprints can satisfy the
        # check even though the tarball download channel is unauthenticated.
        env:
          ALARM_KEY_FPS: >-
            02922214DE8981D14DC2ACABBC704E86B823CD25
            9D22B7BB678DC056B1F7723CB55C5315DCD9EE1A
            69DD6C8FD314223E14362848BF7EEF7A9C6B5765
            68B3537F39A313B3E574D06777193F152BDBE6A6
        run: |
          set -euo pipefail
          rootfs_dir="$RUNNER_TEMP/alarm-rootfs"
          mkdir -p "$rootfs_dir"
          cd "$rootfs_dir"
          curl -fSL --retry 5 --retry-delay 5 \
              -o ArchLinuxARM-aarch64-latest.tar.gz \
              'http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz'
          curl -fSL --retry 5 --retry-delay 5 \
              -o ArchLinuxARM-aarch64-latest.tar.gz.sig \
              'http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz.sig'
          export GNUPGHOME="$RUNNER_TEMP/lt-gpg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          for fp in $ALARM_KEY_FPS; do
              curl -fsSL --retry 5 --retry-delay 5 \
                  "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x${fp}" \
                  | gpg --import
          done
          gpg --status-fd 1 --verify ArchLinuxARM-aarch64-latest.tar.gz.sig \
              ArchLinuxARM-aarch64-latest.tar.gz 2>/dev/null \
              | grep '^\[GNUPG:\] VALIDSIG' > validsig.txt || true
          if [ ! -s validsig.txt ]; then
              echo "::error::The Arch Linux ARM rootfs signature did not verify." >&2
              exit 1
          fi
          # VALIDSIG carries the primary-key fingerprint and, for subkey
          # signatures, the signing-key fingerprint as the last field; accept
          # the rootfs only when one of ALARM's published fingerprints matches.
          fps_seen="$(awk '{ print $3 "\n" $NF }' validsig.txt | tr 'A-F' 'a-f' | sort -u)"
          ok=0
          for fp in $ALARM_KEY_FPS; do
              if grep -qx "$(tr 'A-F' 'a-f' <<<"$fp")" <<<"$fps_seen"; then
                  ok=1
              fi
          done
          [ "$ok" = 1 ] || {
              echo "::error::The rootfs signature key is not one of ALARM's published signing keys." >&2
              exit 1
          }

      - name: Build and push the image to GHCR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image_repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker build \
              --platform linux/arm64 \
              --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              -t "${image_repo}:archlinux-aarch64" \
              -f .github/ci-images/archlinux-aarch64/Dockerfile \
              "$RUNNER_TEMP/alarm-rootfs"

      - name: Push and record the digest-pinned image reference
        id: image
        run: |
          set -euo pipefail
          image_repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker push "${image_repo}:archlinux-aarch64" >/dev/null
          # RepoDigests is populated by the push; strip the name, keep the
          # content-addressed digest, so name@digest is a stable pull
          # reference for the packaging legs.
          ref="$(docker image inspect --format '{{index .RepoDigests 0}}' "${image_repo}:archlinux-aarch64")"
          digest="${ref#*@}"
          echo "image=${image_repo}:archlinux-aarch64@${digest}" >> "$GITHUB_OUTPUT"

  deb-ppa:
    name: DEB (${{ matrix.arch }}, ubuntu / noble) and Launchpad PPA upload
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            ppa_upload: true
          - arch: arm64
            runner: ubuntu-24.04-arm
            ppa_upload: false
    runs-on: ${{ matrix.runner }}
    needs: prepare
    if: needs.prepare.outputs.proceed == 'true'
    timeout-minutes: 90
    env:
      LT_VERSION: ${{ needs.prepare.outputs.version }}
      LINUXTOYS_TEST_MODE: ${{ needs.prepare.outputs.test_mode }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download vendored TUI dependencies
        uses: actions/download-artifact@v4
        with:
          name: tui-vendor
          path: p3/vendor

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
              build-essential debhelper dpkg-dev devscripts dput lintian gnupg \
              cargo rustc python3-dev python3-maturin \
              pkgconf libgtk-3-dev patchelf

      # The source upload runs whenever the private GPG key is configured;
      # no Launchpad-side credential is needed: classic dput uploads to the
      # PPA anonymously and Launchpad verifies identity through the .changes
      # OpenPGP signature. Test runs always exercise the upload: signed with
      # the key (Launchpad rejects the re-used release version - the intended
      # probe outcome), unsigned without it (rejected for the missing
      # signature instead). Only the amd64 leg arms the upload; the arm64 leg
      # never touches the PPA (see the build step below).
      - name: Arm or skip the PPA upload
        if: matrix.ppa_upload
        env:
          TEST_MODE: ${{ needs.prepare.outputs.test_mode }}
          UPLOAD_PPA: ${{ needs.prepare.outputs.upload_ppa }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [[ "$TEST_MODE" == "true" ]]; then
              if [[ -z "$GPG_PRIVATE_KEY" ]]; then
                  echo "LINUXTOYS_SKIP_PPA_UPLOAD=1" >> "$GITHUB_ENV"
                  echo "::warning::Test run without GPG_PRIVATE_KEY: dput will be attempted with an unsigned source and Launchpad is expected to reject it."
              fi
          elif [[ "$UPLOAD_PPA" != "true" || -z "$GPG_PRIVATE_KEY" ]]; then
              echo "LINUXTOYS_SKIP_PPA_UPLOAD=1" >> "$GITHUB_ENV"
              echo "::warning::PPA upload disabled - the toggle is off or GPG_PRIVATE_KEY is missing."
          fi

      - name: Import the GPG signing key
        if: matrix.ppa_upload && env.LINUXTOYS_SKIP_PPA_UPLOAD != '1'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_OWNERTRUST: ${{ secrets.GPG_OWNERTRUST }}
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          printf 'pinentry-mode loopback\n' >> ~/.gnupg/gpg.conf
          printf 'allow-loopback-pinentry\nallow-preset-passphrase\n' > ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent || true
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          # Imported secret keys arrive with unknown ownertrust: the signature
          # is cryptographically fine, but gpgme then yields a summary of
          # zero ("SignatureVerifyError: 0" in dput's signature assertion) -
          # gpg itself only calls it "[unknown]". A real ownertrust file
          # (base64 of the same file the keys were minted with) restores the
          # proper verdict so dput's strict gate reports
          # "Valid signature from <fpr>" before the upload.
          if [ -n "$GPG_OWNERTRUST" ]; then
              echo "$GPG_OWNERTRUST" | base64 -d > "$HOME/.gnupg/ownertrust.tmp"
              if [ -s "$HOME/.gnupg/ownertrust.tmp" ]; then
                  gpg --batch --import-ownertrust < "$HOME/.gnupg/ownertrust.tmp"
              else
                  echo "::warning::GPG_OWNERTRUST present but not valid base64 - ownertrust not imported."
              fi
              rm -f "$HOME/.gnupg/ownertrust.tmp"
          else
              echo "::notice::GPG_OWNERTRUST not set - dput's local signature assert may log 'SignatureVerifyError: 0' (a benign gpgme verdict artifact on freshly imported keys). It does not block the upload; Launchpad remains the authoritative signature check."
          fi
          if [ -n "$GPG_PASSPHRASE" ]; then
              hex="$(printf '%s' "$GPG_PASSPHRASE" | od -An -tx1 | tr -d ' \n')"
              while IFS= read -r keygrip; do
                  [ -n "$keygrip" ] || continue
                  printf 'PRESET_PASSPHRASE %s 0 %s\n' "$keygrip" "$hex" \
                      | gpg-connect-agent --quiet 2>/dev/null || true
              done < <(gpg --list-secret-keys --with-colons --with-keygrip \
                        | awk -F: '$1 == "grp" { print $10 }')
          fi
          gpg --list-secret-keys

      - name: Build the .deb${{ matrix.ppa_upload == true && ' and upload the source package to the PPA' || ' (binary-only)' }}
        # The source reaches Launchpad exactly once, from the amd64 leg (the
        # Launchpad duplicate guard would refuse a second upload of the same
        # version). The arm64 leg therefore runs --binary-only: it prepares
        # the identical source tree and builds only the native arm64 binary
        # package, without any PPA interaction. The binary Architecture comes
        # from the build host (debian/control declares Architecture: any).
        run: |
          args=()
          if [ "${{ matrix.ppa_upload }}" != "true" ]; then
              args+=(--binary-only)
          fi
          bash dev/build/deb/build.sh "$LT_VERSION" "$PWD/.out/deb" "${args[@]}"

      - name: Collect release artifacts
        run: |
          set -e
          mkdir -p release-assets
          cp .out/deb/linuxtoys_"$LT_VERSION"-1_"${{ matrix.arch }}".deb release-assets/
          ls -la release-assets
          echo "RELEASE_ASSETS_DIR=$(cd release-assets && pwd)" >> "$GITHUB_ENV"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-deb-${{ matrix.arch }}
          path: ${{ env.RELEASE_ASSETS_DIR }}
          # include-hidden-files guards against hidden-file filtering at the
          # uploader, so the directory can stay dot-prefixed in the future.
          include-hidden-files: true
          if-no-files-found: error

  rpm:
    name: RPM (${{ matrix.arch }}, Fedora container)
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            srpm: true
          - arch: aarch64
            runner: ubuntu-24.04-arm
            srpm: false
    runs-on: ${{ matrix.runner }}
    needs: prepare
    if: needs.prepare.outputs.proceed == 'true'
    timeout-minutes: 90
    env:
      LT_VERSION: ${{ needs.prepare.outputs.version }}
    container:
      image: fedora:latest
    steps:
      # git must exist before the checkout step can run.
      - name: Install build dependencies
        run: |
          dnf -y install git rpm-build gcc cargo rust python3-devel python3-pip xz \
              maturin gtk3-devel pkgconf-pkg-config patchelf desktop-file-utils

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download vendored TUI dependencies
        uses: actions/download-artifact@v4
        with:
          name: tui-vendor
          path: p3/vendor

      - name: Deploy the Rust bits into p3/app (same as ./build-rust.sh develop)
        run: ./build-rust.sh develop

      - name: Build the RPM and the .src.rpm bundle
        run: bash dev/build/copr/build.sh "$LT_VERSION" "$PWD/.out/rpm"

      - name: Collect release artifacts
        # The binary RPM lands in RPMS/<build-host-arch>; the spec gates the
        # buildable hosts through ExclusiveArch. The .src.rpm is the single
        # arch-independent COPR input: build it on both legs but collect it
        # only from the x86_64 leg, so dist/ never sees two copies of the
        # same file name.
        run: |
          set -e
          mkdir -p release-assets
          cp .out/rpm/RPMS/${{ matrix.arch }}/linuxtoys-*.rpm release-assets/
          if [ "${{ matrix.srpm }}" = "true" ]; then
              cp .out/rpm/SRPMS/linuxtoys-*.src.rpm release-assets/
          fi
          ls -la release-assets
          echo "RELEASE_ASSETS_DIR=$(cd release-assets && pwd)" >> "$GITHUB_ENV"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-rpm-${{ matrix.arch }}
          path: ${{ env.RELEASE_ASSETS_DIR }}
          include-hidden-files: true
          if-no-files-found: error

  arch-pkg:
    name: Arch tarball, PKGBUILD and package (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            image: archlinux:base-devel
            aur_source: true
          - arch: aarch64
            runner: ubuntu-24.04-arm
            # Official Arch images are linux/amd64-only, so the arm runner
            # cannot pull them: run inside the ALARM-based image the ci-image
            # job built and pushed for this run, pinned by digest.
            image: ${{ needs.ci-image.outputs.image }}
            aur_source: false
    runs-on: ${{ matrix.runner }}
    needs: [prepare, ci-image]
    if: needs.prepare.outputs.proceed == 'true'
    timeout-minutes: 90
    env:
      LT_VERSION: ${{ needs.prepare.outputs.version }}
    permissions:
      # The aarch64 leg pulls the private GHCR package ci-image pushed; the
      # runner authenticates ghcr.io pulls with the job token automatically.
      contents: read
      packages: read
    container:
      image: ${{ matrix.image }}
    steps:
      # git must exist before the checkout step can run. fakeroot is required
      # by makepkg, which refuses to run as root, so the build runs as a
      # dedicated unprivileged user.
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
              git rust cargo maturin python python-pip \
              pkgconf patchelf gtk3 fakeroot

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download vendored TUI dependencies
        uses: actions/download-artifact@v4
        with:
          name: tui-vendor
          path: p3/vendor

      - name: Hand the workspace over to the unprivileged builder
        run: |
          useradd -m -s /bin/bash builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Deploy the Rust bits into p3/app (same as ./build-rust.sh develop)
        run: su builder -c "cd \"$GITHUB_WORKSPACE\" && ./build-rust.sh develop"

      - name: Build the package (tarball, PKGBUILD, .pkg.tar.zst)
        run: su builder -c "cd \"$GITHUB_WORKSPACE\" && bash dev/build/pkg/build.sh \"$LT_VERSION\" \"$GITHUB_WORKSPACE/.out/pkg\""

      - name: Collect release artifacts
        # The AUR source bundle (tarball + PKGBUILD, arch array covers both
        # architectures) is architecture-independent: collect it once, from
        # the x86_64 leg, so dist/ never sees two copies of the same name.
        # makepkg names the binary package after the build host's CARCH.
        run: |
          set -e
          mkdir -p release-assets
          if [ "${{ matrix.aur_source }}" = "true" ]; then
              cp .out/pkg/linuxtoys-"$LT_VERSION".tar.xz release-assets/
              cp .out/pkg/PKGBUILD release-assets/
          fi
          cp .out/pkg/linuxtoys-"$LT_VERSION"-1-"${{ matrix.arch }}".pkg.tar.zst release-assets/
          ls -la release-assets
          echo "RELEASE_ASSETS_DIR=$(cd release-assets && pwd)" >> "$GITHUB_ENV"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-arch-${{ matrix.arch }}
          path: ${{ env.RELEASE_ASSETS_DIR }}
          include-hidden-files: true
          if-no-files-found: error

  appimage:
    name: AppImage (${{ matrix.arch }}, Arch container)
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            image: archlinux:base-devel
          - arch: aarch64
            runner: ubuntu-24.04-arm
            # Official Arch images are linux/amd64-only, so the arm runner
            # cannot pull them: run inside the ALARM-based image the ci-image
            # job built and pushed for this run, pinned by digest.
            image: ${{ needs.ci-image.outputs.image }}
    runs-on: ${{ matrix.runner }}
    needs: [prepare, ci-image]
    if: needs.prepare.outputs.proceed == 'true'
    timeout-minutes: 120
    env:
      LT_VERSION: ${{ needs.prepare.outputs.version }}
    permissions:
      # The aarch64 leg pulls the private GHCR package ci-image pushed; the
      # runner authenticates ghcr.io pulls with the job token automatically.
      contents: read
      packages: read
    container:
      image: ${{ matrix.image }}
    steps:
      # git must exist before the checkout step can run. xorg-server-xvfb
      # provides xvfb-run, which quick-sharun needs to trace the dlopened
      # libraries of GUI binaries; appstream supplies libappstream.so.5 and
      # its GObject typelib, webp-pixbuf-loader is passed explicitly to
      # quick-sharun, and zenity/util-linux/jq are bundled into the AppDir.
      # python-requests and python-gobject are runtime Python dependencies of
      # the app itself: DEPLOY_PYTHON makes quick-sharun copy this container's
      # /usr/lib/python3.x (site-packages included) into the AppDir, so unlike
      # the deb/rpm/arch packages the AppImage has no distro dependency system
      # to provide them (TUI: requests; GUI: gi). build.sh verifies both.
      # vte3 is required for the same reason: the GUI and TUI import chains
      # load the Vte GObject namespace at startup (gtk_common.py), but nothing
      # links against libvte - PyGObject resolves it from the typelib at
      # runtime - so quick-sharun's scan never pulls it in and the build host
      # must provide both the typelib and the library (build.sh verifies).
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
              git curl wget rust cargo maturin python python-pip \
              python-requests python-gobject \
              pkgconf patchelf gtk3 vte3 appstream gobject-introspection \
              zenity util-linux webp-pixbuf-loader xorg-server-xvfb \
              adwaita-icon-theme jq

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download vendored TUI dependencies
        uses: actions/download-artifact@v4
        with:
          name: tui-vendor
          path: p3/vendor

      - name: Deploy the Rust bits into p3/app (same as ./build-rust.sh develop)
        run: ./build-rust.sh develop

      - name: Build the AppImage
        # GITHUB_REPOSITORY is intentionally emptied for this step: set, it
        # makes quick-sharun guess and embed an update hint that local builds
        # never embed (LinuxToys ships its own background updater).
        env:
          GITHUB_REPOSITORY: ""
        run: bash dev/build/appimage/build.sh "$LT_VERSION" "$PWD/.out/appimage"

      - name: Collect release artifacts
        # build.sh pins the AppImage name from the build host's uname -m,
        # which matches the matrix arch on both legs.
        run: |
          set -e
          mkdir -p release-assets
          cp .out/appimage/LinuxToys-"$LT_VERSION"-"${{ matrix.arch }}".AppImage release-assets/
          ls -la release-assets
          echo "RELEASE_ASSETS_DIR=$(cd release-assets && pwd)" >> "$GITHUB_ENV"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-appimage-${{ matrix.arch }}
          path: ${{ env.RELEASE_ASSETS_DIR }}
          include-hidden-files: true
          if-no-files-found: error

  release:
    name: Create the GitHub release
    runs-on: ubuntu-24.04
    needs: [prepare, deb-ppa, rpm, arch-pkg, appimage]
    if: needs.prepare.outputs.proceed == 'true' && needs.prepare.outputs.test_mode != 'true'
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      LT_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Gather the built artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          merge-multiple: true
          path: dist

      - name: Download the release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: notes

      - name: Build the checksum file
        run: |
          set -e
          cd dist
          ls -la
          sha256sum * > ../sha256sums.txt
          mv ../sha256sums.txt .

      - name: Create the release with the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$LT_VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$LT_VERSION" \
              --notes-file notes/release-notes.txt \
              dist/*
